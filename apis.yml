aid: wander
name: Wander
description: >-
  Wander is a vertically integrated luxury hospitality company offering smart vacation
  homes with hotel-grade amenities, dedicated remote-work spaces, and 24/7 concierge
  service across North America. Founded by John Andrew Entwistle and headquartered in
  Austin, Texas, Wander powers owners and operators through WanderOS, its proprietary
  agentic AI operating system that automates dynamic pricing, operations, and guest
  support. The company raised a $50M Series B in 2025 co-led by QED Investors and Fifth
  Wall, with Redpoint Ventures, Uncork Capital, Starwood, and Breyer Capital
  participating, bringing total funding past $100M. Wander ships no public developer
  API, but publishes a deliberately agent-ready web surface: an llms.txt, an AI sitemap
  of 8,500+ markdown property pages with live 90-day pricing and availability refreshed
  daily, and Content-Signal AI-use permissions in robots.txt.
